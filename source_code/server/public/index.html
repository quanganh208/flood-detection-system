<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 OTA Update Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        opacity: 0.9;
        font-size: 1.1em;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .card h2 {
        color: #333;
        margin-bottom: 20px;
        font-size: 1.5em;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .upload-area {
        border: 2px dashed #667eea;
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: #f8f9fa;
      }

      .upload-area:hover {
        border-color: #764ba2;
        background: #f0f0f0;
      }

      .upload-area.dragover {
        background: #e8eaf6;
        border-color: #764ba2;
      }

      .upload-icon {
        font-size: 48px;
        color: #667eea;
        margin-bottom: 15px;
      }

      #fileInput {
        display: none;
      }

      .file-list {
        margin-top: 20px;
      }

      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        background: #f8f9fa;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .file-item .name {
        flex: 1;
        color: #333;
      }

      .file-item .size {
        color: #666;
        margin-right: 10px;
        font-size: 0.9em;
      }

      .file-item .remove {
        color: #dc3545;
        cursor: pointer;
        font-weight: bold;
      }

      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-size: 1em;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 600;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .btn-full {
        width: 100%;
        margin-top: 20px;
      }

      .status {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        display: none;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .firmware-list {
        margin-top: 20px;
      }

      .firmware-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .firmware-info {
        flex: 1;
      }

      .firmware-id {
        font-weight: 600;
        color: #333;
        font-family: monospace;
      }

      .firmware-meta {
        color: #666;
        font-size: 0.9em;
        margin-top: 5px;
      }

      .firmware-actions {
        display: flex;
        gap: 10px;
      }

      .btn-small {
        padding: 6px 12px;
        font-size: 0.9em;
      }

      .btn-download {
        background: #28a745;
      }

      .btn-delete {
        background: #dc3545;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .build-log {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 15px;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 0.85em;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🚀 ESP32 OTA Update Manager</h1>
        <p>
          Upload Arduino/PlatformIO source code to build firmware automatically
        </p>
      </div>

      <!-- Upload Card -->
      <div class="card">
        <h2>📤 Upload Source Code</h2>

        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📁</div>
          <h3>Drag & Drop files here</h3>
          <p style="margin: 10px 0; color: #666">or click to browse</p>
          <p style="color: #999; font-size: 0.9em">
            Required: <strong>platformio.ini</strong> +
            <strong>*.ino or *.cpp</strong>
          </p>
        </div>

        <input type="file" id="fileInput" multiple accept=".ino,.cpp,.h,.ini" />

        <div class="file-list" id="fileList"></div>

        <button class="btn btn-full" id="buildBtn" disabled>
          Build Firmware
        </button>

        <div class="status" id="status"></div>
        <div class="build-log" id="buildLog" style="display: none"></div>
      </div>

      <!-- Firmware List Card -->
      <div class="card">
        <h2>📦 Available Firmwares</h2>
        <button class="btn btn-small" onclick="loadFirmwares()">
          🔄 Refresh List
        </button>
        <div class="firmware-list" id="firmwareList"></div>
      </div>
    </div>

    <script>
      let selectedFiles = [];

      const uploadArea = document.getElementById('uploadArea');
      const fileInput = document.getElementById('fileInput');
      const fileList = document.getElementById('fileList');
      const buildBtn = document.getElementById('buildBtn');
      const statusDiv = document.getElementById('status');
      const buildLogDiv = document.getElementById('buildLog');

      uploadArea.addEventListener('click', () => fileInput.click());

      uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
      });

      uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
      });

      uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
      });

      function handleFiles(files) {
        selectedFiles = Array.from(files);
        renderFileList();
        updateBuildButton();
      }

      function renderFileList() {
        if (selectedFiles.length === 0) {
          fileList.innerHTML = '';
          return;
        }

        fileList.innerHTML =
          '<h3 style="margin-bottom: 10px;">Selected Files:</h3>';

        selectedFiles.forEach((file, index) => {
          const div = document.createElement('div');
          div.className = 'file-item';
          div.innerHTML = `
                    <span class="name">📄 ${file.name}</span>
                    <span class="size">${formatBytes(file.size)}</span>
                    <span class="remove" onclick="removeFile(${index})">✕</span>
                `;
          fileList.appendChild(div);
        });
      }

      function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
        updateBuildButton();
      }

      function updateBuildButton() {
        const hasPlatformioIni = selectedFiles.some(
          (f) => f.name === 'platformio.ini',
        );
        const hasMainFile = selectedFiles.some(
          (f) => f.name.endsWith('.ino') || f.name.endsWith('.cpp'),
        );

        buildBtn.disabled = !(
          hasPlatformioIni &&
          hasMainFile &&
          selectedFiles.length > 0
        );
      }

      function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i]
        );
      }

      function showStatus(message, type) {
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        statusDiv.style.display = 'block';
      }

      function hideStatus() {
        statusDiv.style.display = 'none';
      }

      buildBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0) return;

        buildBtn.disabled = true;
        buildBtn.innerHTML = '<span class="loading"></span> Building...';
        hideStatus();
        buildLogDiv.style.display = 'none';

        const formData = new FormData();
        selectedFiles.forEach((file) => {
          formData.append('files', file);
        });

        try {
          const response = await fetch('/api/firmware/build', {
            method: 'POST',
            body: formData,
          });

          const result = await response.json();

          if (response.ok && result.success) {
            showStatus(
              `✅ Build successful! Firmware ID: ${result.data.build_id}`,
              'success',
            );

            if (result.data.build_log) {
              buildLogDiv.textContent = result.data.build_log;
              buildLogDiv.style.display = 'block';
            }

            loadFirmwares();

            selectedFiles = [];
            renderFileList();
          } else {
            showStatus(
              `❌ Build failed: ${result.message || 'Unknown error'}`,
              'error',
            );
            if (result.data && result.data.details) {
              buildLogDiv.textContent = result.data.details;
              buildLogDiv.style.display = 'block';
            }
          }
        } catch (error) {
          showStatus(`❌ Error: ${error.message}`, 'error');
        } finally {
          buildBtn.disabled = false;
          buildBtn.textContent = 'Build Firmware';
          updateBuildButton();
        }
      });

      async function loadFirmwares() {
        const firmwareListDiv = document.getElementById('firmwareList');
        firmwareListDiv.innerHTML = '<p style="color: #999;">Loading...</p>';

        try {
          const response = await fetch('/api/firmware');
          const result = await response.json();

          if (result.success && result.data.length > 0) {
            firmwareListDiv.innerHTML = '';

            result.data.forEach((firmware) => {
              const div = document.createElement('div');
              div.className = 'firmware-item';

              const date = new Date(firmware.created).toLocaleString();

              div.innerHTML = `
                            <div class="firmware-info">
                                <div class="firmware-id">${firmware.buildId}</div>
                                <div class="firmware-meta">
                                    📦 ${formatBytes(firmware.size)} | 📅 ${date}
                                </div>
                            </div>
                            <div class="firmware-actions">
                                <button class="btn btn-small btn-download" onclick="downloadFirmware('${firmware.buildId}')">
                                    ⬇️ Download
                                </button>
                                <button class="btn btn-small btn-delete" onclick="deleteFirmware('${firmware.buildId}')">
                                    🗑️ Delete
                                </button>
                            </div>
                        `;

              firmwareListDiv.appendChild(div);
            });
          } else {
            firmwareListDiv.innerHTML =
              '<p style="color: #999;">No firmwares available yet. Build one!</p>';
          }
        } catch (error) {
          firmwareListDiv.innerHTML = `<p style="color: #dc3545;">Error loading firmwares: ${error.message}</p>`;
        }
      }

      function downloadFirmware(buildId) {
        window.open(`/api/ota/download/${buildId}`, '_blank');
      }

      async function deleteFirmware(buildId) {
        if (!confirm(`Delete firmware ${buildId}?`)) return;

        try {
          const response = await fetch(`/api/firmware/${buildId}`, {
            method: 'DELETE',
          });

          if (response.ok) {
            loadFirmwares();
          } else {
            alert('Failed to delete firmware');
          }
        } catch (error) {
          alert('Error: ' + error.message);
        }
      }
      loadFirmwares();
    </script>
  </body>
</html>
